per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
user root

listener 1883
protocol mqtt

listener 8883
protocol mqtt
certfile /caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/mqtt.javohir.dev/mqtt.javohir.dev.crt
keyfile /caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/mqtt.javohir.dev/mqtt.javohir.dev.key
