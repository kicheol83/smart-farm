services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartfarm-backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production

      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/smartfarm?authSource=admin

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      MQTT_BROKER_URL: mqtt://mosquitto:1883
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}

    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started

    networks:
      - smartfarm-network

    expose:
      - '3000'

  mongo:
    image: mongo:7
    container_name: smartfarm-mongo
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}

    volumes:
      - mongo-data:/data/db

    networks:
      - smartfarm-network

    expose:
      - '27017'

    healthcheck:
      test:
        ['CMD-SHELL', 'mongosh --quiet --eval "db.adminCommand(''ping'').ok"']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartfarm-redis
    restart: unless-stopped

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}

    volumes:
      - redis-data:/data

    networks:
      - smartfarm-network

    expose:
      - '6379'

    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smartfarm-mosquitto
    restart: unless-stopped

    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro

    networks:
      - smartfarm-network

    ports:
      - '1883:1883'

  caddy:
    image: caddy:2-alpine
    container_name: smartfarm-caddy
    restart: unless-stopped

    ports:
      - '80:80'
      - '443:443'

    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

    depends_on:
      - backend

    networks:
      - smartfarm-network

networks:
  smartfarm-network:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
  mosquitto-data:
  mosquitto-log:
  caddy-data:
  caddy-config:
